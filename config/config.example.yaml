# config/config.yaml にコピーして調整してください。書かなかった項目は既定値になります。
# 有効な設定は `poop-detector show-config` で確認できます。

# データ（画像・動画・データベース）の保存先
data_dir: data
# 日別集計と画面の時刻のタイムゾーン（例: Asia/Tokyo）。空ならマシンの設定に従う。
timezone: ""
# 通知と画面に表示する犬の名前（空なら名前を出さない文面）
pet_name: ""

# 監視で使う機能。run の --video-review などのフラグは、ここで false でも一時的に有効にする。
features:
  # 保存した動画を自動判定（既定の判定器は Codex CLI）し、根拠が見えたときだけ通知する
  # （clips.enabled が必要。以前の名前 codex も読める）
  video_review: false
  # 録画を待たずに、トイレでの滞在を知らせる
  early_alert: false
  # トレーの縁を目印に、カメラのずれを補正する（capture-baseline で縁の画像も登録する）
  track_tray: false
  # サークル内の滞在時間と通過回数を記録する（犬の検出を自動で有効にする）
  activity_map: false
  # トレー外での排泄の候補も判定する（video_review が必要。犬の検出を自動で有効にする）
  detect_outside: false
  # 床に新しく現れて動かない物（異物・嘔吐の跡など）の候補を記録する（実験的。
  # setup-activity-map の床面の登録が必要。犬の検出を自動で有効にする）
  floor_objects: false
  # 犬がサークルにいない区間を記録し、外出中に続いたら知らせる（setup-activity-map の床面の
  # 登録が必要。犬の検出を自動で有効にする）
  presence: false
  # カメラの音声から鳴いていた時間を記録する（実験的。音声そのものは保存しない）
  audio: false

# 犬の睡眠の記録（犬の検出を自動で有効にする。床面を登録していれば、その中だけで動きを見る）
sleep:
  enabled: false
  # この時間（分）静止が続いたら寝ているとみなす
  still_minutes: 5
  # 寝ている途中の身じろぎとして許す動きの長さ（秒）
  stir_seconds: 10
  # 睡眠の集計で「昼」とする時間帯（HH:MM-HH:MM。日をまたげない）
  daytime: "09:00-18:00"

camera:
  # 1秒あたりの判定回数
  fps: 3.0
  timeout_ms: 5000
  retry_seconds: 2.0

detection:
  # 候補がこの秒数続いたら記録する
  verify_seconds: 3.0
  # 空がこの秒数続いたら、清掃後の状態を通知済み状態として覚え直す
  clear_seconds: 3.0
  # 画像差分の濃度の閾値（1〜255）
  threshold: 30
  # 色差の閾値。0 で色差の検知を無効にする
  color_threshold: 20
  # 候補にする最小の面積（ROI 内の画素）
  min_area: 40
  # ROI のこの割合以上が変われば、犬などによる遮蔽として判定を保留する
  occupied_ratio: 0.18

notifications:
  enabled: true

# 監視の停止とカメラの不調を、通知先と管理者の Web Push に知らせる見張り
# （カメラは監視が、監視の停止は GUI のサーバーが見張る）
watchdog:
  enabled: true
  # 停止や不調がこの分数続いたら知らせる（同じ停止では1回だけ。復旧したら長さと合わせて知らせる）
  minutes: 5

# 見守り通知（features.early_alert）の調整
early_alert:
  # 同じ場所にこの秒数とどまったら通知する
  stay_seconds: 4
  # 次の見守り通知までの最短の間隔（秒）
  cooldown_seconds: 30

# 検知や犬の出入りの前後の短い動画（常時録画はしない）
clips:
  enabled: true
  before_seconds: 30
  after_seconds: 30
  fps: 5
  max_width: 1280
  # 録画中のコマを置くメモリーの上限（MiB）。同じ滞在をまとめた最長4分ほどの動画（1280幅・5fps）が収まる大きさ
  memory_mb: 256
  disk_mb: 4096
  # 使用量が上限の90％に達したら、1日より古い確認不要の動画（トレー外の滞在から）を自動で整理する
  auto_cleanup: true

# 犬の存在・出入りの検出（setup-dog-model でモデルを準備してから有効にする。run --dog でも指定可）
dog:
  enabled: false
  fps: 1
  confidence: 0.4
  exit_seconds: 2
  clip_cooldown_seconds: 60

# シートの交換どき。通知済みの跡の積み重なりから知らせる（0 の目安は使わない）。
sheet:
  enabled: true
  max_events: 6    # 前回の交換からの排泄の回数
  max_ratio: 0.3   # 汚れが監視範囲に占める割合

# 外出中のままの押し忘れ。外出中にしてからこの時間たったら一度だけ知らせる（0 なら知らせない）
away:
  reminder_hours: 12

# 留守中のまとめ。ホームで「外出中」にしている間だけ静止画を残す（7日で消す）。
digest:
  enabled: true
  snapshot_seconds: 60   # 静止画を残す間隔（秒）
  # 判定器（review.provider）による短い文章の要約。年表の文字を提供元に送るので既定は false
  summary: false
  summary_images: false  # 要約に静止画を4枚まで添える（静止画を提供元に送る）

# 鳴き声の記録（features.audio を有効にして使う）
audio:
  threshold_db: 15      # 周りの静かなときの音量より、これだけ大きい音を候補にする
  notify_seconds: 60    # 外出中に10分のうちこれだけ鳴いていたら知らせる（秒）

# 夜間のまとめ。夜の間だけ静止画を残し（7日で消す）、夜ごとの睡眠の数字と出来事をまとめる
night:
  enabled: false
  hours: "22:00-07:00"   # 夜の時間帯（日をまたいでよい）
  notify: false          # 朝に昨夜のまとめを知らせる（GUI のサーバーが知らせる）

# 移動・睡眠・排泄の回数が、2日続けていつもと違うときに知らせる（GUI のサーバーが確かめる）。
trends:
  notify: true

# 不在の記録（features.presence を有効にして使う）
presence:
  min_minutes: 3     # これより短い不在は記録しない（分）
  away_minutes: 10   # 外出中に不在がこの時間続いたら知らせる（分）

# 床の候補（実験的。features.floor_objects を有効にして使う）。false なら記録だけで通知しない。
floor:
  notify: true
  # 床の候補の画像を判定器（review.provider）に渡し、嘔吐・下痢らしい跡かを確かめる。
  # 画像を提供元に送るので既定は false。GUI のサーバー（gui か run --gui）が判定する
  judge: false

# 排泄後の再侵入。固定トレー・動画保存・登録済みの reentry-layout.json が必要。
reentry:
  enabled: false
  seconds: 2
  margin: 0.02
  high_distance: 0.04
  uncollected_minutes: 30
  notice: medium
  quiet_hours: ""

# 動画の自動判定器（features.video_review を有効にして使う）
review:
  provider: codex   # codex（Codex CLI）、claude（Claude Code CLI）、gemini（Antigravity CLI）
  model: ""         # 空欄は選んだ CLI の既定。指定する場合は画像入力対応のモデル名
  # 判定器の呼び出しが失敗し続けたとき（利用上限など）に切り替える予備の判定器。
  # カンマ区切りで、書いた順に試す（例: "claude,gemini"）。空なら切り替えない
  fallback: ""
  # 監視中に判定器を呼ぶ1時間あたりの上限（0 で上限なし）。上限の半分でトレー外の滞在、
  # 4分の3で犬の出入りの動画を後回しにし、検知と滞在の通知のために枠を残す
  max_per_hour: 20

# GUI（gui コマンドと run --gui）の待ち受けと、外から開くときの設定
gui:
  # 待ち受ける IP アドレス。既定は同じマシンだけ。Docker の中では 0.0.0.0 にする
  host: 127.0.0.1
  # gui --port、run --gui-port を指定すれば、そちらを使う
  port: 8765
  # インターネットから開くときの URL（https://ドメイン名）。HTTPS はリバースプロキシで終端する。
  # 空なら同じマシンからだけ開ける。手順は docs/remote-access.md
  public_url: ""
  # X-Forwarded-Proto などを信頼するプロキシの IP アドレスかネットワーク（カンマ区切り）
  trusted_proxies: 127.0.0.1
  # 操作がないままこの時間（時間）が過ぎると、ログアウトする
  session_idle_hours: 168
  # ログインからこの日数が過ぎると、使っていてもログアウトする
  session_max_days: 30
  # 以前のデザインテーマ（professional か dog）。デザインを1つにしたので、いまは使いません
  theme: professional
