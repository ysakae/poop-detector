# GitHub Release を公開したときに、パッケージを作って PyPI に公開する。
# PyPI 側には Trusted Publishing の設定が必要（docs/releasing.md）。
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: パッケージを作る
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: タグとバージョンが一致するか確認
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "タグ $TAG と pyproject.toml のバージョン $version が一致しません" >&2
            exit 1
          fi
      - name: ビルド
        run: uv build
      - name: メタデータを検査
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: PyPI に公開
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/poop-detector/
    permissions:
      # Trusted Publishing の認証に使う。ほかの権限は与えない。
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
