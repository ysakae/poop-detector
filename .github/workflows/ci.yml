# 静的解析、テスト、Docker イメージの確認。カメラや実データは使わず、人工データだけで行う。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静的解析
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: 依存関係を導入
        run: uv sync --frozen
      - name: Ruff の検査
        run: uv run ruff check .
      - name: 書式の確認
        run: uv run ruff format --check .
      - name: 型チェック
        run: uv run mypy

  package:
    name: パッケージのビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: sdist と wheel を作る
        run: uv build
      - name: メタデータを検査
        run: uvx twine check --strict dist/*
      - name: wheel からインストールして起動する
        run: |
          cd "$RUNNER_TEMP"
          uvx --isolated --from "$GITHUB_WORKSPACE"/dist/*.whl poop-detector --help

  test:
    name: テスト（Python ${{ matrix.python }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # requires-python の下限と、開発に使う .python-version の版
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: FFmpeg を導入
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 依存関係を導入
        run: uv sync --frozen
      - name: Python の版を確認
        run: uv run python --version
      - name: テストとカバレッジ
        # 下限は pyproject.toml の [tool.coverage.report] fail_under
        run: uv run pytest --cov
      - name: 主要な機能の動作確認
        run: uv run python scripts/smoke-check.py

  docker:
    name: Docker イメージ
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: イメージをビルド
        run: docker build -t poop-detector .
      - name: CLI が起動する
        run: docker run --rm poop-detector --help
      - name: コンテナ内で主要な機能の動作確認
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD/scripts:/scripts:ro"
          poop-detector /scripts/smoke-check.py
