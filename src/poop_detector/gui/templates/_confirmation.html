{#- 動画のラベルと一緒に、排泄の確定記録を保存する欄。 -#}
<fieldset><legend>うんち・おしっこの確定記録</legend>
{%- if confirmation.linked -%}
<input type="hidden" name="record_id" value="{{ confirmation.linked }}"><p><a href="/records/events?id={{ confirmation.linked }}">ひも付け済みの記録を開く</a></p><p class="note">確定した日時や種類は、ひも付け済みの記録から編集できます。</p>
{%- else -%}
<label>保存先<select name="record_id">
{%- if confirmation.candidates %}<option value="">保存先を選択</option>{% endif -%}
{{ record_options(confirmation, clip.event_id) }}</select></label><p class="note">すでに記録している場合は、その記録を選んでください。</p>
{%- endif -%}
<button formaction="/clips/confirm">ラベルと確定記録を保存</button></fieldset>
