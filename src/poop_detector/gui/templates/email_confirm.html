{#- メールを開いただけでは消費せず、ログイン済みの本人が確定する。 -#}
{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block content %}
<div class="card entry"><img src="/assets/dog.svg" alt="" width="96" height="96">
<h2>メールアドレスの確認</h2>
<p>メールアドレスをログイン中のアカウントにひも付けます。</p>
<form method="post" action="/account/email/confirm">{{ csrf_field(token) }}
<input name="code" type="hidden" value="{{ code }}">
<button>ひも付ける</button>
</form>
<p><a href="/account">アカウントへ戻る</a></p>
</div>
{% endblock %}
