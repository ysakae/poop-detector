{%- from "_macros.html" import icon -%}
<section class="live-panel" aria-labelledby="live-title">
  <h2 id="live-title">現在のカメラ映像</h2>
  <div class="live-grid">
    <figure class="live-view" id="live-view">
      <div class="live-stage">
        <img id="live-frame" alt="現在のカメラ映像" hidden>
        {#- 動画の画面（ブラウザーの標準の操作バー）にそろえ、映像の下端に重ねて右に全画面のボタンを置く。 -#}
        <div class="live-controls" id="live-controls" hidden>
          <span class="live-badge">ライブ</span>
          <button type="button" class="live-maximize" id="live-maximize" aria-label="全画面表示" title="全画面表示" aria-pressed="false">
            <span class="live-maximize-open">{{ icon("expand") }}</span>
            <span class="live-maximize-close">{{ icon("shrink") }}</span>
          </button>
        </div>
      </div>
      <figcaption id="live-frame-status">監視からの映像を待っています。</figcaption>
    </figure>
    {#- ホームの先頭に置くので、直近の自動判定は短く添える。根拠は動画の画面で読む。 -#}
    <div class="live-result">
      <p><span class="note">直近の自動判定（保存済みの動画）</span> <strong id="live-judgment">判定を読み込み中</strong> <a id="live-clip-link" href="/clips" hidden>動画を開く</a></p>
      <p class="note" id="live-judgment-time"></p>
      <p id="live-reason" hidden></p>
    </div>
  </div>
</section>
<script src="/assets/live.js" defer></script>
