{#- 管理者の操作の監査ログ（新しい順）。 -#}
{% extends "base.html" %}
{% block content %}
<h2>監査ログ</h2>
<p class="note">設定・登録・動画の削除・ユーザーの操作を、誰が・いつ行ったかを新しい順に表示します。</p>
<table><thead><tr><th>日時</th><th>操作した人</th><th>操作</th><th>対象</th></tr></thead><tbody>
{% for entry in entries %}
<tr><td>{{ entry.at }}</td><td>{{ entry.actor }}</td><td>{{ entry.label }}</td><td>{{ entry.detail }}</td></tr>
{% else %}
<tr><td colspan="4">まだ記録がありません。</td></tr>
{% endfor %}
</tbody></table>
{% endblock %}
