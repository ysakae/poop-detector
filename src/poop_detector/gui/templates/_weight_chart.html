{% if chart is defined %}
{% if chart.points %}
<figure class="weight-figure">
<svg class="weight-chart" data-weight-chart width="620" height="335" viewBox="0 0 400 216" role="group" aria-label="体重の推移">
<text class="weight-axis-unit" x="{{ chart.left - 9 }}" y="13" text-anchor="end">g</text>
{% for y, grams in chart.grams %}
<line class="weight-grid" x1="{{ chart.left }}" y1="{{ y }}" x2="{{ chart.right }}" y2="{{ y }}"/>
<text class="weight-tick weight-gram-tick" x="{{ chart.left - 9 }}" y="{{ y }}" dy=".33em" text-anchor="end">{{ "{:,}".format(grams) }}</text>
{% endfor %}
{% if chart.points|length > 1 %}
<polygon class="area" points="{{ chart.points[0].x }},{{ chart.bottom }} {% for point in chart.points %}{{ point.x }},{{ point.y }} {% endfor %}{{ chart.points[-1].x }},{{ chart.bottom }}"/>
<polyline class="line" points="{% for point in chart.points %}{{ point.x }},{{ point.y }} {% endfor %}"/>
{% endif %}
<path class="axis weight-axes" d="M{{ chart.left }} {{ chart.top }}V{{ chart.bottom }}H{{ chart.right }}"/>
{% for x, day in chart.dates %}
<line class="axis" x1="{{ x }}" y1="{{ chart.bottom }}" x2="{{ x }}" y2="{{ chart.bottom + 5 }}"/>
<text class="weight-tick weight-date-tick" x="{{ x }}" y="{{ chart.bottom + 20 }}" text-anchor="{{ 'end' if x == chart.right else 'middle' }}">{{ day }}</text>
{% endfor %}
{% for point in chart.points %}
{%- set weight = "{:,}".format(point.grams) ~ " g" %}
<g class="weight-data-point" transform="translate({{ point.x }} {{ point.y }})" tabindex="0" role="img" aria-label="{{ point.day }} {{ weight }}">
<line class="weight-guide" y1="{{ chart.top - point.y }}" y2="{{ chart.bottom - point.y }}" aria-hidden="true"/>
<circle class="weight-marker" r="3.5"/>
<circle class="weight-hit" r="11"/>
<g class="weight-tooltip" transform="translate({{ point.tooltip_x }} {{ point.tooltip_y }})" aria-hidden="true">
<rect width="112" height="44" rx="7"/>
<text class="weight-tooltip-day" x="10" y="16">{{ point.day }}</text>
<text class="weight-tooltip-value" x="10" y="34">{{ weight }}</text>
</g>
</g>
{% endfor %}
</svg>
</figure>
<script src="/assets/weight_chart.js" defer></script>
{% endif %}
{% elif points %}
{# 稼働中の旧プロセスがテンプレートだけを読み直したときも、従来のグラフを表示する。 #}
<figure class="weight-figure">
<svg class="weight-chart" width="320" height="125" viewBox="0 0 320 125" role="img" aria-label="体重の推移。値は表で確認できます">
<polygon class="area" points="{{ points[0][0] }},115 {% for x,y in points %}{{ x }},{{ y }} {% endfor %}{{ points[-1][0] }},115"/>
<line class="axis" x1="12" y1="115" x2="308" y2="115"/>
<polyline class="line" points="{% for x,y in points %}{{ x }},{{ y }} {% endfor %}"/>
{% for x,y in points %}<circle cx="{{ x }}" cy="{{ y }}" r="3.5"/>{% endfor %}
</svg>
<figcaption>{{ bounds[0] }}{% if bounds[0] != bounds[1] %} 〜 {{ bounds[1] }}{% endif %}</figcaption>
</figure>
{% endif %}
