[project]
name = "poop-detector"
version = "0.1.0"
description = "ここちゃんのトイレの変化を検知するローカル監視ツール"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.10,<5", "numpy>=2,<3", "PyYAML>=6,<7", "psutil>=6,<8"]
[project.scripts]
poop-detector = "poop_detector.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
