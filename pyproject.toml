[project]
name = "poop-detector"
version = "0.1.0"
description = "犬のトイレの変化を検知して通知するローカル監視ツール"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoshiaki Sakae" }]
keywords = ["dog", "pet", "toilet", "camera", "rtsp", "opencv", "monitoring", "ntfy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "opencv-python>=4.10,<5",
    "numpy>=2,<3",
    "PyYAML>=6,<7",
    "psutil>=6,<8",
    "python-dotenv>=1.1,<2",
    "jinja2>=3.1,<4",
]
[project.urls]
Homepage = "https://github.com/ysakae/poop-detector"
Documentation = "https://github.com/ysakae/poop-detector/tree/main/docs"
Repository = "https://github.com/ysakae/poop-detector"
Issues = "https://github.com/ysakae/poop-detector/issues"
Changelog = "https://github.com/ysakae/poop-detector/blob/main/CHANGELOG.md"
[project.scripts]
poop-detector = "poop_detector.main:main"
[build-system]
# license-files（PEP 639）に対応した版
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-psutil>=6,<8",
    "types-pyyaml>=6,<7",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
source = ["poop_detector"]
[tool.coverage.report]
# 2026-11 の実測（全体 91%）から少し余裕を持たせた下限。テストを足したら引き上げる。
fail_under = 89
show_missing = true
skip_covered = true
[tool.mypy]
files = ["src"]
# src/ のすべての関数に引数と戻り値の型を求める。
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_reexport = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "B",
    "UP",   # 新しい Python の書き方
    "SIM",  # 単純にできる分岐
    "C4",   # 内包表記
    "PT",   # pytest の書き方
    "RUF",  # Ruff 独自の検査
    "PL",   # Pylint 相当の検査
    "C90",  # 関数の複雑度
    "ARG",  # 未使用の引数
    "S",    # セキュリティ（bandit 相当）
    "T20",  # print の残り
    "RET",  # return の書き方
    "N",    # 命名規則
    "D100", # モジュールの docstring
    "D101", # 公開クラスの docstring
]
ignore = [
    # 日本語の文章で全角の括弧・句読点・記号を使うため、紛らわしい文字の検査は外す。
    "RUF001", "RUF002", "RUF003",
    # 画像処理のしきい値や HTTP の状態コードなど、その場で意味の分かる数値が多いため。
    "PLR2004",
    # OpenCV より前に FFmpeg のログを抑える必要があり（main.py）、重い依存は使うコマンドで
    # だけ読み込むため、関数内の import を許す。
    "PLC0415",
    # 複雑度と引数の数は、CLI・監視ループ・GUI の分割（#22、#23、#24）で解消してから有効にする。
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# CLI と補助スクリプトは標準出力に結果を表示する。
"src/poop_detector/main.py" = ["T201"]
"src/poop_detector/commands/*" = ["T201"]
"scripts/*" = ["T201"]
# テストでは assert を使い、偽オブジェクトは本物と同じ引数を受け取るだけで使わない。
# OpenCV の API に合わせた名前（isOpened など）と、テスト用の固定の認証情報も許す。
"tests/*" = ["S101", "S105", "S603", "ARG", "N802", "D100", "D101"]
